[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vds-form-django"
version = "1.1.0"
description = "VDS Universal Form Builder — Django/Python trusted execution adapter (vds.expr/1 engine, server re-validation, RBAC, idempotency, redacted audit)."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.1",
]
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
django = ["django>=5.2,<6.2"]
test = ["pytest>=7", "django>=5.2,<6.2"]

[tool.setuptools.packages.find]
include = ["vds_form*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
