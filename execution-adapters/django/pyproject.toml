[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vds-form-django"
version = "1.1.0"
description = "VDS Universal Form Builder — Django/Python trusted execution adapter (vds.expr/1 engine, server re-validation, RBAC, idempotency, redacted audit)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
django52 = ["Django>=5.2,<5.3"]
django61 = ["Django>=6.1,<6.2"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["vds_form*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
