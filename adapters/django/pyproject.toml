[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vds-form-renderer-django"
version = "0.1.0"
description = "VDS Universal Form Builder — Django server-rendered form renderer (shared HTML contract + trusted submission)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
django52 = ["Django>=5.2,<5.3"]
django61 = ["Django>=6.1,<6.2"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["vds_form_renderer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
