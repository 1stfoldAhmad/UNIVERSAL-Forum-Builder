[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vds-form-renderer-django"
version = "0.1.0"
description = "VDS Universal Form Builder — Django server-rendered form renderer (shared HTML contract + trusted submission)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["Django>=4.2"]

[tool.setuptools.packages.find]
include = ["vds_form_renderer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
