name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Every job fails on a real failure. There are no `|| true` guards and no
# silently skipped targets: a step either passes, fails visibly, or is an
# explicitly named blocker with a reason.
#
# ORDERING RULE: `npm run setup:vds` MUST run before `npm ci`. The vendored
# @vds-form/vds-logic engine is a `file:` workspace dependency; installing first
# creates an empty vendor node_modules and breaks typecheck/tests.

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Fetch + build vendored VDS logic engine
        run: npm run setup:vds
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run all Vitest projects (core / native / web / angular)
        run: npx vitest run
      - name: Cross-language conformance (CLI)
        run: npx tsx tools/cli/src/bin.ts conformance
      - name: Capability mirrors are up to date
        run: npm run capabilities:check
      - name: Generated support matrix is up to date
        run: npm run support-matrix:check
      - name: Real node:sqlite durable-store APIs (requires Node >= 22.5)
        run: npx vitest run --project core packages/form-persistence execution-adapters/node
      - name: Build live-preview example
        run: cd examples/react-app && npx vite build
      - name: Benchmarks (smoke)
        run: npm run bench
      - name: Build packages (JS + declarations)
        run: npm run build:packages
      - name: Pack release tarballs (no publish)
        run: npm run pack:packages
      - name: Fresh external-project package smoke test
        run: npm run test:packages

  nextjs:
    name: Next.js App Router example (SSR + hydration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fetch + build vendored VDS logic engine
        run: npm run setup:vds
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build packages (the example consumes built output)
        run: npm run build:packages
      - name: Next.js production build
        run: npm run build --workspace @vds-form/example-next-app
      - name: SSR / hydration / trusted-submission tests
        run: npx vitest run --project nextjs

  django:
    name: Django ${{ matrix.django }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Deliberate, documented matrix. Verified against PyPI metadata:
        #   Django 5.2.x (LTS) requires Python >= 3.10
        #   Django 6.1.x       requires Python >= 3.12
        include:
          - { django: '5.2.19', python: '3.10' }
          - { django: '5.2.19', python: '3.11' }
          - { django: '5.2.19', python: '3.12' }
          - { django: '5.2.19', python: '3.13' }
          - { django: '5.2.19', python: '3.14' }
          - { django: '6.1.3', python: '3.12' }
          - { django: '6.1.3', python: '3.13' }
          - { django: '6.1.3', python: '3.14' }
          - { django: '6.1.3', python: '3.15' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch + build vendored VDS logic engine
        run: npm run setup:vds
      - name: Install TS deps (to generate shared IR fixtures)
        run: npm ci --no-audit --no-fund
      - name: Generate compiled IR fixtures from the TS compiler
        run: npx tsx execution-adapters/django/scripts/gen_ir_fixtures.ts
      - name: Install Python test deps (pinned Django from the matrix)
        run: python3 -m pip install pytest "Django==${{ matrix.django }}"
      - name: Report the real runtime versions
        run: python3 -c "import sys, django; print('Python', sys.version); print('Django', django.get_version())"
      - name: Execution adapter tests (conformance + trusted handler + CSRF/session/RBAC/tenant/idempotency)
        run: cd execution-adapters/django && python3 -m pytest -q
      - name: Renderer tests (SSR + trusted view + CSRF)
        run: cd adapters/django && python3 -m pytest -q
      - name: Deprecation warnings are errors (future-version readiness)
        run: cd execution-adapters/django && python3 -m pytest -q -W error::DeprecationWarning

  laravel:
    name: PHP ${{ matrix.php }} trusted adapter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Validate composer manifest
        run: |
          cd execution-adapters/laravel
          set +e
          composer validate --strict --no-check-publish > /tmp/cv.log 2>&1
          code=$?
          cat /tmp/cv.log
          if [ $code -ne 0 ]; then grep -viE '^\s*$' /tmp/cv.log | head -20 | sed 's/^/::error::/'; fi
          exit $code
      - name: Install Composer dev deps (illuminate/http for the real-Request integration check)
        run: cd execution-adapters/laravel && composer update --no-interaction --prefer-dist --no-progress
      - name: Run all PHP suites (expression + form + asset conformance, idempotency, handler, controller, security)
        env:
          VDS_REQUIRE_ILLUMINATE: '1'   # fail if the real-Request integration would be skipped
          VDS_REQUIRE_PDO_SQLITE: '1'   # fail if the durable-restart check would be skipped
        run: cd execution-adapters/laravel && composer test
      - name: Run Laravel renderer suite (framework-free, real PHP)
        run: php adapters/laravel/tests/run-renderer.php

  laravel13:
    name: Laravel 13 full HTTP lifecycle (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, ctype, filter, hash, openssl, session, tokenizer
          coverage: none
          tools: composer:v2
      - name: Validate composer manifest
        run: |
          cd adapters/laravel
          set +e
          composer validate --strict --no-check-publish > /tmp/cv.log 2>&1
          code=$?
          cat /tmp/cv.log
          if [ $code -ne 0 ]; then grep -viE '^\s*$' /tmp/cv.log | head -20 | sed 's/^/::error::/'; fi
          exit $code
      - name: Fresh consumer install (Laravel 13 + path-linked execution adapter)
        run: |
          cd adapters/laravel
          set +e
          composer update --no-interaction --prefer-dist --no-progress > /tmp/cu.log 2>&1
          code=$?
          tail -60 /tmp/cu.log
          if [ $code -ne 0 ]; then grep -iE 'problem|require|conflict|could not|error' /tmp/cu.log | head -30 | sed 's/^/::error::/'; fi
          exit $code
      - name: Run the real Laravel 13 HTTP integration suite
        run: |
          cd adapters/laravel
          set +e
          php tests/run-laravel13.php > /tmp/l13.log 2>&1
          code=$?
          cat /tmp/l13.log
          if [ $code -ne 0 ]; then grep -E 'Fatal|Error|FAIL|Uncaught' /tmp/l13.log | head -30 | sed 's/^/::error::/'; fi
          exit $code

  flutter:
    name: Flutter renderer (analyze + format + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Dart dependencies
        run: cd adapters/flutter && flutter pub get
      - name: Static analysis
        run: |
          cd adapters/flutter
          set +e
          flutter analyze > /tmp/analyze.log 2>&1
          code=$?
          tail -80 /tmp/analyze.log
          if [ $code -ne 0 ]; then grep -E '^\s*(error|warning|info)' /tmp/analyze.log | head -40 | sed 's/^/::error::/'; fi
          exit $code
      - name: Formatting is canonical
        run: |
          cd adapters/flutter
          set +e
          dart format --output=none --set-exit-if-changed . > /tmp/fmt.log 2>&1
          code=$?
          cat /tmp/fmt.log
          if [ $code -ne 0 ]; then
            # Surface the exact diff as annotations so the failure is actionable.
            dart format --output=show . > /tmp/fmt-show.log 2>&1
            grep -E '^Changed|^Formatted' /tmp/fmt.log | head -30 | sed 's/^/::error::/'
          fi
          exit $code
      - name: Flutter tests (shared conformance + controller + uploads + widgets)
        run: |
          cd adapters/flutter
          set +e
          flutter test > /tmp/flutter.log 2>&1
          code=$?
          tail -120 /tmp/flutter.log
          if [ $code -ne 0 ]; then grep -E 'Error|error:|Expected|Actual|FAILED|Failed|Exception' /tmp/flutter.log | head -45 | sed 's/^/::error::/'; fi
          exit $code
      - name: Publish dry-run (packaging validation, never publishes)
        run: |
          cd adapters/flutter
          set +e
          flutter pub publish --dry-run > /tmp/pub.log 2>&1
          code=$?
          tail -60 /tmp/pub.log
          if [ $code -ne 0 ]; then grep -viE '^\s*$' /tmp/pub.log | head -40 | sed 's/^/::error::/'; fi
          exit $code

  compose:
    name: Compose renderer (core tests + UI compile + UI tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK (preinstalled on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Core tests (shared conformance + controller + uploads + submission guard)
        run: |
          cd adapters/compose
          set +e
          gradle :core:test --no-daemon --console=plain > /tmp/core.log 2>&1
          code=$?
          tail -80 /tmp/core.log
          if [ $code -ne 0 ]; then grep -E '^e: |error:|FAILURE|What went wrong|Execution failed|Caused by|Could not|FAILED|Unresolved|not found|Exception|expected' /tmp/core.log | head -45 | sed 's/^/::error::/'; fi
          exit $code
      - name: Compose UI compile evidence
        run: |
          cd adapters/compose
          set +e
          gradle :ui:compileDebugKotlin --no-daemon --console=plain > /tmp/ui.log 2>&1
          code=$?
          tail -80 /tmp/ui.log
          if [ $code -ne 0 ]; then grep -E '^e: |error:|FAILURE|What went wrong|Execution failed|Caused by|Could not|FAILED|Unresolved|not found|Exception' /tmp/ui.log | head -45 | sed 's/^/::error::/'; fi
          exit $code
      - name: Compose UI + accessibility tests (Robolectric, real controls)
        run: |
          cd adapters/compose
          set +e
          gradle :ui:testDebugUnitTest --no-daemon --console=plain > /tmp/uitest.log 2>&1
          code=$?
          tail -100 /tmp/uitest.log
          if [ $code -ne 0 ]; then grep -E '^e: |error:|FAILURE|What went wrong|Execution failed|Caused by|Could not|FAILED|Unresolved|not found|Exception|expected' /tmp/uitest.log | head -45 | sed 's/^/::error::/'; fi
          exit $code
      - name: Build the publishable AAR (local artifact, never published)
        run: |
          cd adapters/compose
          set +e
          gradle :core:jar :ui:assembleRelease --no-daemon --console=plain > /tmp/artifact.log 2>&1
          code=$?
          tail -40 /tmp/artifact.log
          if [ $code -ne 0 ]; then grep -E '^e: |error:|FAILURE|What went wrong|Execution failed|Could not|Unresolved' /tmp/artifact.log | head -30 | sed 's/^/::error::/'; fi
          exit $code
      - name: Record artifact evidence
        run: find adapters/compose -name '*.aar' -o -name 'core.jar' | tee compose-artifacts.txt

  swiftui:
    name: SwiftUI renderer (tests + UI target build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Swift tests (shared conformance + controller + uploads + submission guard + capabilities)
        run: |
          cd adapters/swiftui
          set +e
          swift test > /tmp/swift.log 2>&1
          code=$?
          tail -120 /tmp/swift.log
          if [ $code -ne 0 ]; then grep -E 'error:|failed|XCTAssert|Fatal|warning: .*deprecat' /tmp/swift.log | head -45 | sed 's/^/::error::/'; fi
          exit $code
      - name: Build the SwiftUI UI target explicitly
        run: |
          cd adapters/swiftui
          set +e
          swift build --target VdsFormUI > /tmp/swiftui.log 2>&1
          code=$?
          tail -60 /tmp/swiftui.log
          if [ $code -ne 0 ]; then grep -E 'error:|failed' /tmp/swiftui.log | head -45 | sed 's/^/::error::/'; fi
          exit $code
      - name: SwiftPM package validation
        run: cd adapters/swiftui && swift package describe --type json > /dev/null

  packaging:
    name: Python packaging (wheel build + fresh install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build both wheels + sdists
        run: |
          set +e
          python3 -m pip install --upgrade build
          (cd execution-adapters/django && python3 -m build) > /tmp/build1.log 2>&1
          c1=$?
          (cd adapters/django && python3 -m build) > /tmp/build2.log 2>&1
          c2=$?
          tail -20 /tmp/build1.log; tail -20 /tmp/build2.log
          if [ $c1 -ne 0 ] || [ $c2 -ne 0 ]; then
            grep -iE 'error|invalid|failed|Traceback' /tmp/build1.log /tmp/build2.log | head -30 | sed 's/^/::error::/'
            exit 1
          fi
      - name: Fresh virtualenv install (both local wheels; nothing is published)
        run: |
          set +e
          python3 -m venv /tmp/fresh
          # The renderer declares vds-form-django as a runtime dependency. Neither
          # package is published, so both wheels are installed from this build.
          /tmp/fresh/bin/pip install execution-adapters/django/dist/*.whl adapters/django/dist/*.whl > /tmp/pip.log 2>&1
          code=$?
          tail -30 /tmp/pip.log
          if [ $code -ne 0 ]; then grep -iE 'error|no matching|conflict' /tmp/pip.log | head -30 | sed 's/^/::error::/'; exit $code; fi
      - name: Both distributions import in the fresh environment
        run: |
          set +e
          /tmp/fresh/bin/python -c "import vds_form, vds_form_renderer; print('imported', vds_form.__name__, vds_form_renderer.__version__)" > /tmp/imp.log 2>&1
          code=$?
          cat /tmp/imp.log
          if [ $code -ne 0 ]; then grep -iE 'Error|No module' /tmp/imp.log | head -20 | sed 's/^/::error::/'; exit $code; fi
      - name: Declared dependency boundary is present in installed metadata
        run: |
          /tmp/fresh/bin/pip show vds-form-django vds-form-renderer-django
          /tmp/fresh/bin/python -c "
          from importlib.metadata import requires
          r = requires('vds-form-renderer-django') or []
          assert any('vds-form-django' in x for x in r), r
          assert any('Django' in x for x in r), r
          print('renderer runtime deps:', r)
          "
